<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>論文プリント採点</title>
<meta name="theme-color" content="#34508A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* 1列の採点票：紙を選ぶ → 時刻 → 1回目の答え → × の問だけの「直し」を回ごとに足す → 知らなかった語 */
:root{
  --ground:#F3F4F7; --surface:#FFFFFF; --ink:#1D2130; --muted:#5D6375; --line:#D5D8E1;
  --accent:#34508A; --accent-ink:#FFFFFF; --accent-soft:#E3E9F5; --red:#C2362F; --red-soft:#FBE8E6; --ok:#2F6B4A;
  --font:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14161C; --surface:#1D2029; --ink:#E5E7EE; --muted:#9CA2B3; --line:#343947;
    --accent:#93AEE6; --accent-ink:#121A2E; --accent-soft:#24304A; --red:#FF7468; --red-soft:#3B2321; --ok:#7CC9A0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#14161C; --surface:#1D2029; --ink:#E5E7EE; --muted:#9CA2B3; --line:#343947;
  --accent:#93AEE6; --accent-ink:#121A2E; --accent-soft:#24304A; --red:#FF7468; --red-soft:#3B2321; --ok:#7CC9A0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding:env(safe-area-inset-top,0px) 16px 0}
.wrap{max-width:460px;margin:0 auto;padding-block:12px 120px;display:flex;flex-direction:column;gap:14px}
.banner{font-size:12px;color:var(--red);background:var(--red-soft);border-radius:6px;padding:6px 10px}
header{display:flex;flex-direction:column;gap:2px}
header .sub{font-size:13px;color:var(--muted)}
header h1{font-size:20px;margin:0;text-wrap:balance}
.hint{font-size:13px;color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.times{display:flex;gap:14px;flex-wrap:wrap}
.times label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
input[type="time"],textarea{font:inherit;color:var(--ink);background:var(--ground);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:60px;resize:vertical}
.lab{font-weight:700;font-size:14px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sheet.locked{opacity:.8}
.sheet.fix.active{border:2px solid var(--red)}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px 2px}
.shead h2{font-size:16px;margin:0}
.shead .pts{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.sec{font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--muted);padding:8px 14px 2px}
.row{display:grid;grid-template-columns:3.2em 1fr 2em;align-items:center;gap:8px;padding:6px 14px}
.row.x{background:var(--red-soft)}
.qn{font-weight:700}
.opts{display:flex;gap:6px}
.opt{width:42px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;font-weight:700;cursor:pointer;padding:0}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.opt:disabled{cursor:default}
.mark{font-size:24px;line-height:1;font-weight:700;text-align:center;color:var(--red)}
.sfoot{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
.msg{font-size:13px;color:var(--muted);margin:0;min-height:1.2em}
.score{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.score .big{font-size:30px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.score p{margin:0;color:var(--muted);font-size:13px}
.done{border:2px solid var(--ok)}
.done h2{margin:0;font-size:18px;color:var(--ok)}
.done p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 18px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:12px 22px;border-radius:10px;cursor:pointer}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:8px 14px;border-radius:10px;cursor:pointer}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
details summary{cursor:pointer;font-weight:700}
.days{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.days button{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:8px 2px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.days li:first-child button{border-top:0}
.days .st{color:var(--muted);font-size:13px;white-space:nowrap}
.days button[aria-current="true"]{font-weight:700}
.foot{font-size:12px;color:var(--muted);text-align:center;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.foot button{border:0;background:none;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.gate{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;padding:16px;z-index:10}
.gate .card{max-width:360px;width:100%;align-items:center;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:.92}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="card">
    <h2>論文プリント採点</h2>
    <p>Google アカウントでログインすると、紙の答えを入れて採点できます（技術士の答え入力と同じアカウント）。</p>
    <button class="primary" id="loginBtn">ログイン</button>
    <p id="authMsg"></p>
  </div>
</div>

<div class="wrap">
  <div class="banner" id="demoBanner" hidden>見本モードです。入れた内容はどこにも保存されません。</div>

  <section id="empty" hidden>
    <div class="card">
      <h2>まだ紙が届いていません</h2>
      <p>PC が紙を作ると、ここにも届きます。</p>
    </div>
  </section>

  <section id="main" hidden style="display:flex;flex-direction:column;gap:14px">
    <header>
      <span class="sub" id="hSub"></span>
      <h1 id="hTitle"></h1>
    </header>

    <div class="panel">
      <div class="times">
        <label for="tStart">開始 <input type="time" id="tStart"></label>
        <label for="tEnd">終了 <input type="time" id="tEnd"></label>
      </div>
      <label class="lab" for="unknown">知らなかった語（紙で丸を付けた語。読点かカンマで区切る）</label>
      <textarea id="unknown" placeholder="例：sustainability, chronic"></textarea>
    </div>

    <div class="panel score" id="scorebox" hidden>
      <div class="big" id="scoreNum"></div>
      <p id="scoreNote"></p>
    </div>

    <div id="forms" style="display:flex;flex-direction:column;gap:14px"></div>

    <div class="panel done" id="donebox" hidden>
      <h2>全部 ○。記録しました</h2>
      <p id="doneMsg"></p>
    </div>

    <p class="hint">紙の□に書いた番号を押して「採点する」。× の問だけの「直し」の欄が下にできるので、紙の裏のヒントで直して答え、全部 ○ になるまで続ける。</p>
    <div><button class="ghost" id="resetBtn">この紙を最初からやり直す</button></div>
  </section>

  <details id="daysBox" hidden>
    <summary>ほかの紙</summary>
    <ul class="days" id="days"></ul>
  </details>

  <div class="foot"><span id="acct"></span><button id="logoutBtn" hidden>ログアウト</button></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/* 論文英語プリントの採点画面（設計の正本＝Vault 20_Projects/英語学習2026.md「論文英語プリント」）。
   採点は公文どおり：その場で ○× を出し、× の問だけ直して全部 ○ まで送り直す（技術士の入力画面とはここが違う）。
   データ（Firestore・プロジェクト gijutsushi-pwa を技術士と共用）：
     users/{uid}/eigo/{紙のid}  PC（eigo-print/src/eigo_sync.py push）が id・no・title・sub・items・sections・key・order を置く。
                               この画面が start・end・unknown・rounds・doneAt・updatedAt を足す。
                               rounds＝[{qs:[問の添字], sel:[選んだ番号|null], ok:[○×|null]}]（1回目→直し1回目→…）
     users/{uid}/meta/eigo     ログインの印。PC が uid を見つけるのに使う。
   問題文・原文・ヒントはこのリポジトリ（公開）に入れない。 */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, setDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

/* Firebase設定（技術士と同じプロジェクト。公開して安全な値＝秘密鍵ではない） */
const firebaseConfig = {
  apiKey: "AIzaSyDLlbavjNCsqlziUcPhojDBRaozNA_QSco",
  authDomain: "gijutsushi-pwa.firebaseapp.com",
  projectId: "gijutsushi-pwa",
  storageBucket: "gijutsushi-pwa.firebasestorage.app",
  messagingSenderId: "244803768578",
  appId: "1:244803768578:web:a3dd61516567d60a60721b"
};

const CIRC = ["①","②","③","④"];
const $ = id => document.getElementById(id);
const DEMO = new URLSearchParams(location.search).has("demo");

let db = null, uid = null, unsub = null;
let sheets = {};          // { 紙のid: ドキュメント }
let cur = null;           // 表示中の紙
let st = null;            // 表示中の紙の記録 { start, end, unknown, rounds, doneAt }
let pinned = false;       // 本人が選んだ紙。届いた更新で勝手に切り替えない
let saveTimer = null;

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1800); }
function el(tag, attrs = {}, text){ const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; }

/* ---------- 記録 ---------- */
const nOf = s => s.items.length;
function freshRound(qs){ return { qs, sel: qs.map(() => null), ok: qs.map(() => null) }; }
function freshState(s){ return { start: "", end: "", unknown: "", rounds: [freshRound([...Array(nOf(s)).keys()])], doneAt: null }; }
function stateOf(s){
  if (!Array.isArray(s.rounds) || !s.rounds.length) return freshState(s);
  return { start: s.start || "", end: s.end || "", unknown: s.unknown || "", doneAt: s.doneAt || null,
           rounds: s.rounds.map(r => ({ qs: r.qs.slice(), sel: (r.sel || []).slice(), ok: (r.ok || []).slice() })) };
}
const graded = r => r.ok.length > 0 && r.ok.every(v => v !== null);
const last = () => st.rounds[st.rounds.length - 1];
function firstOk(){ const r = st.rounds[0]; return graded(r) ? r.ok.filter(Boolean).length : 0; }
const pts = n => Math.round(n / nOf(sheets[cur]) * 100);
function minutes(){
  if (!st.start || !st.end) return null;
  const [a, b] = [st.start, st.end].map(t => t.split(":").map(Number));
  let m = (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]); if (m < 0) m += 1440; return m;
}
const sectionOf = (s, q) => (s.sections.find(x => q >= x.from && q <= x.to) || {}).name || "";

function save(now = false){
  const id = cur, patch = { start: st.start, end: st.end, unknown: st.unknown, rounds: st.rounds, doneAt: st.doneAt, updatedAt: new Date().toISOString() };
  sheets[id] = { ...sheets[id], ...patch };
  if (DEMO || !uid) return;
  clearTimeout(saveTimer);
  const go = () => setDoc(doc(db, "users", uid, "eigo", id), patch, { merge: true })
    .catch(e => { if (e && e.code === "permission-denied") toast("保存できませんでした（権限）"); });
  if (now) go(); else saveTimer = setTimeout(go, 500);
}

/* ---------- 採点 ---------- */
function pick(q, c){
  const r = last(), i = r.qs.indexOf(q);
  r.sel[i] = r.sel[i] === c ? null : c;
  pinned = true; save(); render();
}

function grade(){
  const s = sheets[cur], r = last();
  const empty = r.qs.filter((q, i) => !r.sel[i]);
  if (empty.length) { $("msg").textContent = "まだ選んでいない問があります：" + empty.map(q => s.items[q]).join("・"); return; }
  r.ok = r.qs.map((q, i) => r.sel[i] === s.key[q]);
  const wrong = r.qs.filter((q, i) => !r.ok[i]);
  if (wrong.length) st.rounds.push(freshRound(wrong));
  else st.doneAt = new Date().toISOString();
  pinned = true; save(true); render();
  if (wrong.length) { const f = $("forms").lastElementChild; if (f && f.scrollIntoView) f.scrollIntoView({ behavior: "smooth", block: "start" }); }
}

/* ---------- 表示 ---------- */
function buildRound(s, r, idx){
  const active = idx === st.rounds.length - 1 && !graded(r);
  const box = el("div", { class: "sheet" + (active ? " active" : " locked") + (idx > 0 ? " fix" : "") });
  const head = el("div", { class: "shead" });
  head.append(el("h2", {}, idx === 0 ? `1回目（全${r.qs.length}問）` : `直し ${idx}回目（${r.qs.length}問）`));
  if (graded(r)) head.append(el("span", { class: "pts" }, `○ ${r.ok.filter(Boolean).length}／${r.qs.length}`));
  box.append(head);
  let lastSec = "";
  r.qs.forEach((q, i) => {
    const sec = sectionOf(s, q);
    if (sec !== lastSec) { box.append(el("div", { class: "sec" }, sec)); lastSec = sec; }
    const row = el("div", { class: "row" + (r.ok[i] === false ? " x" : "") });
    const opts = el("div", { class: "opts" });
    CIRC.forEach((c, j) => {
      const b = el("button", { class: "opt", type: "button", id: `${cur}-r${idx}-q${q}-c${j + 1}`, "aria-pressed": String(r.sel[i] === j + 1), "aria-label": `${s.items[q]} の ${j + 1} 番` }, c);
      if (active) b.onclick = () => pick(q, j + 1); else b.disabled = true;
      opts.append(b);
    });
    row.append(el("span", { class: "qn" }, s.items[q]), opts, el("span", { class: "mark" }, r.ok[i] === null ? "" : (r.ok[i] ? "○" : "×")));
    box.append(row);
  });
  if (active) {
    const f = el("div", { class: "sfoot" });
    const g = el("button", { class: "primary", type: "button", id: "gradeBtn" }, idx === 0 ? "採点する" : "直しを採点する");
    g.onclick = grade;
    f.append(g, el("p", { class: "msg", id: "msg" }));
    box.append(f);
  }
  return box;
}

function renderDays(){
  const box = $("days"), ids = Object.keys(sheets).sort((a, b) => sheets[b].order - sheets[a].order).slice(0, 30);
  box.replaceChildren();
  for (const id of ids) {
    const s = sheets[id];
    const status = s.doneAt ? "全部 ○" : (Array.isArray(s.rounds) && s.rounds.length && graded(s.rounds[0]) ? "直し中" : "未採点");
    const b = el("button", { type: "button", "aria-current": String(id === cur) });
    b.append(el("span", {}, `${s.no}　${s.title}`), el("span", { class: "st" }, status));
    b.onclick = () => { $("daysBox").open = false; pinned = true; openSheet(id); window.scrollTo(0, 0); };
    const li = el("li"); li.append(b); box.append(li);
  }
  $("daysBox").hidden = ids.length < 2;
}

function render(){
  const s = cur && sheets[cur];
  $("empty").hidden = !!s;
  $("main").hidden = !s;
  if (!s) { $("daysBox").hidden = true; return; }
  $("hTitle").textContent = `論文プリント ${s.no}　${s.title}`;
  $("hSub").textContent = s.sub || "";
  const forms = $("forms"); forms.replaceChildren();
  st.rounds.forEach((r, i) => forms.append(buildRound(s, r, i)));
  const g = graded(st.rounds[0]);
  $("scorebox").hidden = !g;
  if (g) {
    const left = st.rounds.length > 1 && !st.doneAt ? last().qs.length : 0;
    $("scoreNum").textContent = pts(firstOk()) + "点";
    $("scoreNote").textContent = st.doneAt ? "全部 ○（点は1回目）" : `残り ${left}問。下の「直し」の欄で答える`;
  }
  $("donebox").hidden = !st.doneAt;
  if (st.doneAt) {
    const m = minutes(), x = st.rounds.length - 1;
    $("doneMsg").textContent = `1回目 ${pts(firstOk())}点` + (x ? `・直し ${x}回` : "") + (m === null ? "・開始と終了の時刻を入れると、かかった時間も残ります" : `・${m}分`) + "。知らなかった語は後から足しても届きます。";
  }
  renderDays();
}

function openSheet(id){
  cur = id; st = stateOf(sheets[id]);
  $("tStart").value = st.start; $("tEnd").value = st.end; $("unknown").value = st.unknown;
  render();
}

function pickDefault(){
  const ids = Object.keys(sheets).sort((a, b) => sheets[b].order - sheets[a].order);
  return ids.find(id => !sheets[id].doneAt) || ids[0] || null;
}

function applySheets(next){
  const had = cur && sheets[cur];
  sheets = next;
  if (pinned && cur && sheets[cur]) { if (!had) openSheet(cur); else renderDays(); return; }
  const d = pickDefault();
  if (d && d !== cur) openSheet(d); else if (d) renderDays(); else { cur = null; render(); }
}

/* ---------- 入力欄 ---------- */
for (const [id, prop] of [["tStart", "start"], ["tEnd", "end"], ["unknown", "unknown"]]) {
  $(id).addEventListener("input", e => { if (!st) return; st[prop] = e.currentTarget.value; pinned = true; save(); if (st.doneAt) render(); });
}
let resetArmed = false;
$("resetBtn").onclick = e => {
  if (!resetArmed) { resetArmed = true; e.currentTarget.textContent = "もう一度押すと、この紙の記録が消えます"; return; }
  resetArmed = false; e.currentTarget.textContent = "この紙を最初からやり直す";
  st = freshState(sheets[cur]); save(true); openSheet(cur);
};

/* ---------- データ ---------- */
function startSync(){
  const q = query(collection(db, "users", uid, "eigo"), orderBy("order", "desc"), limit(60));
  unsub = onSnapshot(q, snap => {
    const next = {};
    snap.forEach(d => { const v = d.data(); if (v && Array.isArray(v.items) && Array.isArray(v.key)) next[d.id] = v; });
    applySheets(next);
  }, () => toast("読み込みに失敗しました"));
  setDoc(doc(db, "users", uid, "meta", "eigo"), { app: "eigo-pwa", lastSignIn: new Date().toISOString() }, { merge: true }).catch(() => {});
}
function stopSync(){ if (unsub) { unsub(); unsub = null; } }

function startDemo(){
  $("demoBanner").hidden = false;
  const items = ["復1", "復2", "問1", "問2", "問3", "問4", "問5", "問6", "問7", "問8", "問9", "問10"];
  applySheets({
    "99_demo": { id: "99_demo", no: "99", title: "見本", sub: "段階1（簡約版あり）／見本の答えは全部 ①", order: 99, items,
      sections: [{ name: "前回の復習", from: 0, to: 1 }, { name: "A 語", from: 2, to: 6 }, { name: "B 簡約版", from: 7, to: 8 }, { name: "C 原文", from: 9, to: 11 }],
      key: items.map(() => 1) }
  });
}

/* ---------- 起動 ---------- */
if (DEMO) {
  startDemo();
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  const provider = new GoogleAuthProvider();
  $("loginBtn").onclick = async () => {
    $("authMsg").textContent = "";
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      const code = (e && e.code) || "";
      if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment" || code === "auth/cancelled-popup-request") {
        try { await signInWithRedirect(auth, provider); } catch (e2) { $("authMsg").textContent = "ログイン失敗: " + (e2.code || e2.message); }
      } else if (code !== "auth/popup-closed-by-user") { $("authMsg").textContent = "ログイン失敗: " + (code || e.message); }
    }
  };
  $("logoutBtn").onclick = () => signOut(auth);
  getRedirectResult(auth).catch(() => {});
  onAuthStateChanged(auth, user => {
    if (user) { uid = user.uid; $("acct").textContent = user.email || "ログイン中"; $("logoutBtn").hidden = false; $("gate").hidden = true; startSync(); }
    else { uid = null; stopSync(); sheets = {}; cur = null; render(); $("acct").textContent = ""; $("logoutBtn").hidden = true; $("gate").hidden = false; }
  });
}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
